<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара - Практика 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=400&auto=format&fit=crop" 
             alt="Наручные часы" class="product-card__image">
        
        <div class="product-card__content">
            <h2 class="product-card__title">Классические часы</h2>
            
            <p class="product-card__description">
                Элегантный дизайн и современные технологии. Идеальный аксессуар для делового стиля.
            </p>

            <div class="product-card__footer">
                <span class="price">15 500 ₽</span>
                <button class="btn-action">Купить</button>
            </div>
        </div>
    </div>

</body>
</html>
